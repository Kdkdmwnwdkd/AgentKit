name: Build Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 commit / 分支 / tag（留空 = 当前分支 HEAD）。回滚用：填旧 commit。"
        required: false
        default: ""

# A 批：同一 ref 的构建串行，避免两个 run 的发布步骤交错。
# 之前 304 的发布在 305 之后完成，把 latest 覆盖成旧包（latest=v1.304，HEAD=run 305）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release（gh release create/upload）需要写仓库内容的权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # W-41：回滚时用旧 commit 重新出包。版本号取自 run number，天然比旧包大，
          # 可覆盖安装、不丢数据（Android 不允许版本号倒退的包覆盖安装）。
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (手动安装，避免 setup-android action 在现行 runner 上损坏)
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # 注意：追加 $GITHUB_PATH 对同一 step 内不生效，必须显式 export PATH
          export ANDROID_HOME=$SDK
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          # NDK 26.3 + cmake 3.22.1：本地 llama.cpp 推理（九步第 3 步）native 构建用
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # 缓存 llama.cpp 源码（~50MB，每次 clone 几分钟）与 CMake 产物。
      #
      # 为什么要缓存：`assembleDebug` 在 CI 上约 5 分钟，其中 lama.cpp 的
      # 拉取 + NDK 编译占大头。源码按固定 tag（b4600）拉取，内容稳定，天然适合缓存。
      # key 里带 tag：换版本时自动失效，不会拿到旧源码。
      #
      # 注意：**只缓存源码，不缓存 .so**。缓存二进制会让"改了 C++ 却没重编"变成
      # 一个静默的坑（本地改了 jni 代码，CI 拿旧 .so 出包，行为对不上源码）。
      - name: Cache llama.cpp source
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/llama.cpp
          key: llama-src-b4600-${{ runner.os }}
          restore-keys: |
            llama-src-b4600-

      - name: Point local.properties to SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch llama.cpp b4600 (构建时拉取，不进仓库)
        run: ./scripts/fetch-llama.sh git

      - name: Fetch Shizuku APK (内置一键安装用，构建时拉取，不进仓库)
        # 不阻断构建：共享 runner IP 匿名调用 GitHub API 极易 429/403（限流）。
        # 拿不到就跳过内置包——应用会退到官方发布页，功能不缺失，只是少一步便利。
        #
        # 2026-10-22 修：匿名调 API 被限流 → 包内没有 assets/shizuku.apk →
        # apk 反验判 FAIL → QA 门禁把整次构建打红（fbd4c0d / 6196648 两连红）。
        # 两处一起改：① 带 token 调 API（配额从 60/h 提到 5000/h）；
        #              ② 下载没成功时导出标记，让反验把这一项判为 SKIP 而不是 FAIL
        #                 （「CI 没拉到」和「代码把资产弄丢了」是两件事，不能同一个判定）。
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          URL=$(curl -sSL --max-time 60 \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/RikkaApps/Shizuku/releases/latest 2>/dev/null \
                | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x for x in d.get('assets',[]) if x['name'].endswith('.apk')];print(a[0]['browser_download_url'] if a else '')" 2>/dev/null || true)
          if [ -n "$URL" ]; then
            echo "downloading $URL"
            if ! curl -fL --max-time 180 "$URL" -o app/src/main/assets/shizuku.apk; then
              rm -f app/src/main/assets/shizuku.apk
              echo "WARN: 下载失败，跳过内置安装包"
            fi
          else
            echo "WARN: 未找到 Shizuku APK（API 限流或发布变更），跳过内置安装包（应用会退到官方发布页）"
          fi
          # 给下游反验一个明确信号：没拉到 ≠ 代码有问题
          if [ ! -s app/src/main/assets/shizuku.apk ]; then
            echo "AGENTKIT_SHIZUKU_ASSET=absent" >> "$GITHUB_ENV"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # CI runner 没有预装 kotlinc 发行版，但 Gradle 已经下过 kotlin-compiler-embeddable。
      # 这里包一层同名命令，让只认 `$KOTLINC_HOME/bin/kotlinc` 的老 harness 也能跑。
      - name: Prepare kotlinc shim (老 harness 只认 kotlinc 命令)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        run: |
          CACHE="$HOME/.gradle/caches/modules-2/files-2.1"
          KJAR=$(find "$CACHE/org.jetbrains.kotlin/kotlin-compiler-embeddable" -name 'kotlin-compiler-embeddable-*.jar' 2>/dev/null | grep -v sources | head -1)
          STD=$(find "$CACHE/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' 2>/dev/null | grep -v sources | head -1)
          TROVE=$(find "$CACHE/org.jetbrains.intellij.deps/trove4j" -name 'trove4j-*.jar' 2>/dev/null | head -1)
          ANN=$(find "$CACHE/org.jetbrains/annotations" -name 'annotations-*.jar' 2>/dev/null | head -1)
          if [ -z "$KJAR" ] || [ -z "$STD" ]; then
            echo "WARN: 缓存里没有 kotlin 编译器，跳过 shim（相关 harness 会自行 SKIP）"
            exit 0
          fi
          mkdir -p /tmp/kotlinc/bin
          # 老 harness 还会直接引用 $KC_HOME/lib/kotlin-stdlib.jar，一并放好
          mkdir -p /tmp/kotlinc/lib
          cp "$STD" /tmp/kotlinc/lib/kotlin-stdlib.jar
          # 早期批次脚本把这两个路径写死成了本机临时目录，这里复原（找不到就退化成 SKIP）
          mkdir -p /tmp/w7-jars
          SER_JSON=$(find "$CACHE/org.jetbrains.kotlinx/kotlinx-serialization-json-jvm" -name 'kotlinx-serialization-json-jvm-*.jar' 2>/dev/null | grep -v sources | head -1)
          SER_CORE=$(find "$CACHE/org.jetbrains.kotlinx/kotlinx-serialization-core-jvm" -name 'kotlinx-serialization-core-jvm-*.jar' 2>/dev/null | grep -v sources | head -1)
          [ -n "$SER_JSON" ] && cp "$SER_JSON" /tmp/w7-jars/kotlinx-serialization-json-jvm-1.6.3.jar
          [ -n "$SER_CORE" ] && cp "$SER_CORE" /tmp/w7-jars/kotlinx-serialization-core-jvm-1.6.3.jar
          # 序列化编译器插件（-Xplugin 用）。必须与编译器同为 embeddable 变体：
          # 非 embeddable 插件配 embeddable 编译器会在编译期内部崩溃（exit=2）。
          curl -sSL --max-time 120 \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-serialization-compiler-plugin-embeddable/1.9.25/kotlin-serialization-compiler-plugin-embeddable-1.9.25.jar \
            -o /tmp/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar \
            && ls -lh /tmp/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar || echo "WARN: 序列化插件下载失败"
          {
            echo '#!/usr/bin/env bash'
            # 官方 kotlinc 会自动带上 stdlib；直接调 K2JVMCompiler 不会，
            # 调用方没给 -classpath 时补上，否则报 "cannot access built-in declaration kotlin.Int"
            echo 'STD="'"$STD"'"'
            echo 'if ! printf "%s\n" "$@" | grep -q -- "-classpath"; then'
            echo '  set -- -classpath "$STD" "$@"'
            echo 'fi'
            echo "exec java -cp \"$KJAR:$STD:$TROVE:$ANN\" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \"\$@\""
          } > /tmp/kotlinc/bin/kotlinc
          chmod +x /tmp/kotlinc/bin/kotlinc
          /tmp/kotlinc/bin/kotlinc -version

      # QA harness：把仓库里全部断言跑一遍（纯 JVM + APK 静态反验）。
      #
      # 这一步本身保持「只报告」（continue-on-error）：断言是历史批次陆续写的，
      # 可能因环境差异（JDK/缓存/路径）报红，先出一份完整日志供排查。
      #
      # **真正的门禁在下一条 step（QA gate）**：它读同一份日志，只卡三件确定的事
      # （known-broken 清单非空 / 汇总 FAIL>0 / 出现 XPASS），
      # 不会因「某个 harness 因环境不具备而 SKIP」误伤。
      #
      # 回滚开关：仓库变量 QA_HARNESS=off 即可整步跳过，无需改代码。
      - name: QA harness (report only)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        # 注意：不要在这里显式写 env.AGENTKIT_SHIZUKU_ASSET。
        # 写入 $GITHUB_ENV 的变量会自动进入后续步骤的环境；用表达式覆盖反而可能在
        # 求值阶段取到空串，把运行时值抹掉，SKIP 逻辑就失效了。
        run: |
          set +e
          bash scripts/qa/run-all.sh app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee /tmp/qa.log
          # tee 会吞掉左边的退出码，必须取 PIPESTATUS[0]，
          # 否则 run-all.sh 明明 FAIL=1，CI 看到的仍是 0。
          echo "runner exit=${PIPESTATUS[0]}" >> /tmp/qa.log

      # QA 硬门禁：防止失效项悄悄沉淀。
      #
      # 为什么必须有这道门：run-all.sh 把 known-broken.txt 里的 harness 归为 XFAIL，
      # **不阻塞构建**。这个设计本身对，但副作用是——一个新引入的失效 harness
      # 只要往清单里加一行，就能长期挂在 CI 上不被人发现。
      # 这道门禁把「沉淀」变成当场报红。
      #
      # 逃生阀：仓库变量 QA_GATE=warn 时只告警不失败（紧急止血用，默认硬失败）。
      - name: QA gate
        if: ${{ vars.QA_HARNESS != 'off' }}
        run: |
          bash scripts/qa/gate.sh /tmp/qa.log

      - name: QA harness summary
        if: always()
        run: |
          {
            echo "### QA harness（report only）+ QA gate（硬门禁）"
            echo ""
            echo '```'
            tail -80 /tmp/qa.log 2>/dev/null || echo "(无日志：该步被 QA_HARNESS=off 跳过，或脚本缺失)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时只看 tail 定位不了（编译器内部错误的关键行在前面），完整日志随包上传
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: qa-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 额外把 APK 发到 latest Release，便于用 ghproxy 等加速镜像直链下载。
      # A 批：只在 main 发布；分支构建只上传 artifact，不碰 latest（否则推修复分支会把用户包换掉）。
      # 不再「先 delete 再 create」——删除会造成下载窗口 404，也是上一轮新旧包互相覆盖的帮凶。
      - name: Publish APK to Release (latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="AgentKit latest (run ${{ github.run_number }})"
          NOTES="commit ${{ github.sha }}"
          # 先保证 release 存在（tag 已存在时 create 会失败，忽略即可）。
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$NOTES" || true
          # 再覆盖上传 APK。
          #
          # 为什么要显式 upload --clobber 而不是只靠 create：
          # tag 已存在时 create 直接失败，APK 根本没换——旧包会被当成新包发出去，
          # 用户装到的是上一版的代码，还以为是最新的。
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" --clobber
          # 最后把标题/说明也刷成当前这次的 run 号与 commit。
          #
          # 为什么要多这一步：原来只写「create || upload」，create 失败时走 upload 分支，
          # 而 upload **不会改 title**——于是 release 标题会永远停在首次创建时那个 run 号
          #（实测停在 "run 321"，而包其实已经是 run 334 的），看标题判断版本会判错。
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "$NOTES"
