name: Build Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 commit / 分支 / tag（留空 = 当前分支 HEAD）。回滚用：填旧 commit。"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release（gh release create/upload）需要写仓库内容的权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # W-41：回滚时用旧 commit 重新出包。版本号取自 run number，天然比旧包大，
          # 可覆盖安装、不丢数据（Android 不允许版本号倒退的包覆盖安装）。
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (手动安装，避免 setup-android action 在现行 runner 上损坏)
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # 注意：追加 $GITHUB_PATH 对同一 step 内不生效，必须显式 export PATH
          export ANDROID_HOME=$SDK
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          # NDK 26.3 + cmake 3.22.1：本地 llama.cpp 推理（九步第 3 步）native 构建用
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Point local.properties to SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Fetch llama.cpp b4600 (构建时拉取，不进仓库)
        run: ./scripts/fetch-llama.sh git

      - name: Fetch Shizuku APK (内置一键安装用，构建时拉取，不进仓库)
        # 不阻断构建：GitHub API 对共享 runner IP 常返 403（限流）。
        # 拿不到就跳过内置包——应用会退到官方发布页，功能不缺失，只是少一步便利。
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          URL=$(curl -sSL --max-time 60 https://api.github.com/repos/RikkaApps/Shizuku/releases/latest 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x for x in d.get('assets',[]) if x['name'].endswith('.apk')];print(a[0]['browser_download_url'] if a else '')" 2>/dev/null || true)
          if [ -n "$URL" ]; then
            echo "downloading $URL"
            curl -fL --max-time 180 "$URL" -o app/src/main/assets/shizuku.apk && ls -lh app/src/main/assets/shizuku.apk || echo "WARN: 下载失败，跳过"
          else
            echo "WARN: 未找到 Shizuku APK（API 限流或发布变更），跳过内置安装包（应用会退到官方发布页）"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # CI runner 没有预装 kotlinc 发行版，但 Gradle 已经下过 kotlin-compiler-embeddable。
      # 这里包一层同名命令，让只认 `$KOTLINC_HOME/bin/kotlinc` 的老 harness 也能跑。
      - name: Prepare kotlinc shim (老 harness 只认 kotlinc 命令)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        run: |
          CACHE="$HOME/.gradle/caches/modules-2/files-2.1"
          KJAR=$(find "$CACHE/org.jetbrains.kotlin/kotlin-compiler-embeddable" -name 'kotlin-compiler-embeddable-*.jar' 2>/dev/null | grep -v sources | head -1)
          STD=$(find "$CACHE/org.jetbrains.kotlin/kotlin-stdlib" -name 'kotlin-stdlib-*.jar' 2>/dev/null | grep -v sources | head -1)
          TROVE=$(find "$CACHE/org.jetbrains.intellij.deps/trove4j" -name 'trove4j-*.jar' 2>/dev/null | head -1)
          ANN=$(find "$CACHE/org.jetbrains/annotations" -name 'annotations-*.jar' 2>/dev/null | head -1)
          if [ -z "$KJAR" ] || [ -z "$STD" ]; then
            echo "WARN: 缓存里没有 kotlin 编译器，跳过 shim（相关 harness 会自行 SKIP）"
            exit 0
          fi
          mkdir -p /tmp/kotlinc/bin
          # 老 harness 还会直接引用 $KC_HOME/lib/kotlin-stdlib.jar，一并放好
          mkdir -p /tmp/kotlinc/lib
          cp "$STD" /tmp/kotlinc/lib/kotlin-stdlib.jar
          # 早期批次脚本把这两个路径写死成了本机临时目录，这里复原（找不到就退化成 SKIP）
          mkdir -p /tmp/w7-jars
          SER_JSON=$(find "$CACHE/org.jetbrains.kotlinx/kotlinx-serialization-json-jvm" -name 'kotlinx-serialization-json-jvm-*.jar' 2>/dev/null | grep -v sources | head -1)
          SER_CORE=$(find "$CACHE/org.jetbrains.kotlinx/kotlinx-serialization-core-jvm" -name 'kotlinx-serialization-core-jvm-*.jar' 2>/dev/null | grep -v sources | head -1)
          [ -n "$SER_JSON" ] && cp "$SER_JSON" /tmp/w7-jars/kotlinx-serialization-json-jvm-1.6.3.jar
          [ -n "$SER_CORE" ] && cp "$SER_CORE" /tmp/w7-jars/kotlinx-serialization-core-jvm-1.6.3.jar
          # 序列化编译器插件（-Xplugin 用）。必须与编译器同为 embeddable 变体：
          # 非 embeddable 插件配 embeddable 编译器会在编译期内部崩溃（exit=2）。
          curl -sSL --max-time 120 \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-serialization-compiler-plugin-embeddable/1.9.25/kotlin-serialization-compiler-plugin-embeddable-1.9.25.jar \
            -o /tmp/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar \
            && ls -lh /tmp/kotlinc/lib/kotlinx-serialization-compiler-plugin.jar || echo "WARN: 序列化插件下载失败"
          {
            echo '#!/usr/bin/env bash'
            # 官方 kotlinc 会自动带上 stdlib；直接调 K2JVMCompiler 不会，
            # 调用方没给 -classpath 时补上，否则报 "cannot access built-in declaration kotlin.Int"
            echo 'STD="'"$STD"'"'
            echo 'if ! printf "%s\n" "$@" | grep -q -- "-classpath"; then'
            echo '  set -- -classpath "$STD" "$@"'
            echo 'fi'
            echo "exec java -cp \"$KJAR:$STD:$TROVE:$ANN\" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler \"\$@\""
          } > /tmp/kotlinc/bin/kotlinc
          chmod +x /tmp/kotlinc/bin/kotlinc
          /tmp/kotlinc/bin/kotlinc -version

      # QA harness：把仓库里全部断言跑一遍（纯 JVM + APK 静态反验）。
      #
      # 为什么是「只报告」而不是硬门禁：这批断言是历史批次陆续写的，第一次进 CI 可能
      # 因环境差异（JDK/缓存/路径）报红。先用一批观察，稳定后把 continue-on-error 删掉
      # 就是硬门禁——**不要直接改死**，否则一次误报就把所有人堵在门口。
      #
      # 回滚开关：仓库变量 QA_HARNESS=off 即可整步跳过，无需改代码。
      - name: QA harness (report only)
        if: ${{ vars.QA_HARNESS != 'off' }}
        continue-on-error: true
        run: |
          set +e
          bash scripts/qa/run-all.sh app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee /tmp/qa.log
          echo "runner exit=$?" >> /tmp/qa.log

      - name: QA harness summary
        if: always()
        run: |
          {
            echo "### QA harness（report only，不阻塞构建）"
            echo ""
            echo '```'
            tail -80 /tmp/qa.log 2>/dev/null || echo "(无日志：该步被 QA_HARNESS=off 跳过，或脚本缺失)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时只看 tail 定位不了（编译器内部错误的关键行在前面），完整日志随包上传
      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: qa-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 额外把 APK 发到 latest Release，便于用 ghproxy 等加速镜像直链下载
      - name: Publish APK to Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --title "AgentKit latest (run ${{ github.run_number }})" \
            --notes "commit ${{ github.sha }}" || \
          gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --repo "${{ github.repository }}" --clobber
